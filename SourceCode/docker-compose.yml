
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: quanlycatruc-keycloak
    command: start-dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Chua_cau_hinh_mat_khau}
    volumes:
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped

volumes:
  keycloak_data:
